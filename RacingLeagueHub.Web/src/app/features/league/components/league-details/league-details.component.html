@if (dto(); as league) {

<section class="mb-8 flex flex-col-reverse gap-6 border border-base-300 bg-base-100 p-5 sm:flex-row sm:items-center sm:justify-between sm:p-8">

    <div class="min-w-0 space-y-4">
        <div class="flex flex-wrap gap-2 uppercase">
            <span class="badge badge-primary rounded-none font-bold">
                {{ league.abbreviation }}
            </span>
            <span class="badge badge-outline rounded-none">
                {{ regionLabels[league.region] }}
            </span>
        </div>

        <div class="flex flex-wrap items-center gap-4">
            <h2 class="text-2xl font-bold uppercase sm:text-3xl">{{ league.name }}</h2>

            @if (canEdit()) {
                <a class="btn btn-outline btn-sm rounded-none" routerLink="edit">Edit</a>
            }
        </div>

        @if (league.description) {
        <p class="max-w-prose text-sm text-base-content/80">
            {{ league.description }}
        </p>
        }

        <div class="flex items-center gap-2 text-sm text-base-content/70">
            <span class="material-symbols-outlined text-[16px]">schedule</span>
            {{ league.timezone }}
        </div>
    </div>

    @if (league.logoUrl) {
    <figure class="shrink-0">
        <img [src]="league.logoUrl" [alt]="league.name"
            class="max-h-24 object-contain drop-shadow-md drop-shadow-base-content/10 sm:max-h-32" />
    </figure>
    }
</section>

@if (league.slug) {
    <season-list [leagueSlug]="league.slug" [canEdit]="canEdit()"></season-list>
}

} @else {
<div class="flex justify-center items-center py-16">
    <span class="loading loading-spinner loading-md"></span>
</div>
}

<router-outlet></router-outlet>
